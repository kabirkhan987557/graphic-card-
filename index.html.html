<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#2563eb);height:100vh;overflow:hidden;color:#fff}.page{position:absolute;inset:0;display:none;justify-content:center;align-items:center;padding:20px}.active{display:flex}.card{max-width:430px;width:94%;background:rgba(255,255,255,.12);padding:28px;border-radius:20px;text-align:center}button{padding:14px 24px;border:none;border-radius:30px;margin:8px;font-size:18px}.yes,.next{background:#fff;color:#2563eb}.no{background:#555;color:#fff}.heart{position:fixed;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}</style></head><body><div id=a class="page active"><div class=card><h1>👨‍👦 प्यारे पापा ❤️</h1><p>मेरी एक छोटी-सी रिक्वेस्ट है...</p><button class=next onclick="go('b')">अगला</button></div></div><div id=b class=page><div class=card><h1>💻 पापा, प्लीज़...</h1><p>मेरा कंप्यूटर पुराना हो गया है। अगर उसमें Graphics Card लग जाए, तो मैं और अच्छे से पढ़ाई, एडिटिंग और गेमिंग कर पाऊँगा। मैं वादा करता हूँ कि मेहनत करूँगा। ❤️</p><button class=next onclick="go('c')">अगला</button></div></div><div id=c class=page><div class=card><h1>🥺 क्या आप मुझे Graphics Card दिला देंगे?</h1><button class=yes onclick="yes()">हाँ ❤️</button><button id=no class=no>सोचूँगा 😅</button></div></div><script>function go(i){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(i).classList.add("active")}let no=document.getElementById("no");["mouseover","touchstart"].forEach(e=>no.addEventListener(e,()=>{no.style.position="absolute";no.style.left=Math.random()*70+"%";no.style.top=Math.random()*80+"%";}));function yes(){document.body.innerHTML='<div class="page active"><div class="card"><h1>❤️ धन्यवाद पापा ❤️</h1><p>दुनिया के सबसे अच्छे पापा आप हैं। मैं आपको बहुत प्यार करता हूँ।</p></div></div>';setInterval(()=>{let h=document.createElement("div");h.className="heart";h.innerHTML=["❤️","💖","💙","🎮"][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+"vw";h.style.fontSize=(20+Math.random()*20)+"px";h.style.animationDuration=(3+Math.random()*3)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),6000)},120);}</script></body></html>
